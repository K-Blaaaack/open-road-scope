name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb rpm tar.gz
            artifact: linux
            sidecar_python: sidecar/.venv/bin/python
          - os: windows-latest
            args: --win nsis portable msi
            artifact: windows
            sidecar_python: sidecar/.venv/Scripts/python.exe
          - os: macos-latest
            args: --mac dmg zip
            artifact: macos
            sidecar_python: sidecar/.venv/bin/python
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml

      - name: 准备 sidecar 虚拟环境
        run: |
          python -m venv sidecar/.venv
          ${{ matrix.sidecar_python }} -m pip install -e "sidecar/[dev]" pyinstaller
        shell: bash

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建应用
        run: pnpm build

      - name: 构建 sidecar
        run: pnpm build:sidecar

      - name: 打包发行物
        run: pnpm exec electron-builder --config electron-builder.config.ts ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 产物命名统一：OpenRoadScope-<版本>-<平台>-<架构>.<扩展名>
      # electron-builder 的 arch 输出为 x64，平台为 win/mac，此处统一为 x86_64 与 windows/macos
      - name: 统一产物命名
        run: |
          for f in dist/*; do
            base="$(basename "$f")"
            new="${base/-win-/-windows-}"
            new="${new/-mac-/-macos-}"
            new="${new/-x64./-x86_64.}"
            if [ "$new" != "$base" ]; then mv "$f" "dist/$new"; fi
          done
          ls -1 dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: dist/*

  android:
    name: Build android
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools, platforms;android-36, build-tools;36.0.0"

      - name: 安装依赖
        run: pnpm install

      - name: 构建 Web 渲染层
        run: pnpm build:android-web

      - name: 同步 Web 产物到安卓工程
        run: pnpm sync:android

      - name: 构建 APK（按 CPU 架构拆分）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/OpenRoadScope-*.apk

  publish:
    name: 发布 Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（获取 CHANGELOG）
        uses: actions/checkout@v4

      - name: 下载各平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 从 CHANGELOG 提取当前版本说明
        run: |
          python - <<'PY'
          import os, re
          ver = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # 匹配 "## [0.1.2](...)" 或 "## 0.1.2 ..." 到下一个 "## " 或文件结尾
          m = re.search(rf"^##\s+\[?{re.escape(ver)}\]?.*?(?=^##\s|\Z)", text, re.M | re.S)
          body = m.group(0).strip() if m else ""
          open("release_body.md", "w", encoding="utf-8").write(body or "（暂无更新说明）")
          print(f"版本 {ver} 说明 {'已提取' if m else '未找到，使用占位'}")
          PY

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release_body.md
          files: |
            release-assets/*
