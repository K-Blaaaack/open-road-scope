name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.3.0）；留空只构建不发布
        type: string
        required: false
      platforms:
        description: 构建范围
        type: choice
        options: [all, desktop, android, harmonyos]
        default: all
      publish:
        description: 是否创建 GitHub Release（需填写 tag）
        type: boolean
        default: false

permissions:
  contents: write

# 同一 ref 的发布串行执行，避免两个 tag 同时改写同一 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # 所有产物共用一次质量门禁，任一失败则不进入打包
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 JDK（校验安卓传输逻辑）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式与静态检查
        run: pnpm lint && pnpm typecheck

      - name: 单元与平台测试
        run: |
          pnpm test:node
          pnpm test:web
          pnpm test:desktop
          pnpm test:ci
          pnpm test:android
          pnpm test:harmonyos

  build:
    name: Build ${{ matrix.artifact }}
    needs: check
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || inputs.platforms == 'desktop' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            args: --linux AppImage deb rpm tar.gz --x64
            artifact: linux-x64
          - os: windows-2025
            arch: x64
            args: --win nsis portable msi --x64
            artifact: windows-x64
          - os: windows-11-arm
            arch: arm64
            # builder 26.15.3 的 WiX MSI 包装仍是 x64；ARM64 使用 NSIS 和便携版。
            args: --win nsis portable --arm64
            artifact: windows-arm64
          - os: macos-15
            arch: arm64
            args: --mac dmg zip --arm64
            artifact: macos-arm64
          - os: macos-15-intel
            arch: x64
            args: --mac dmg zip --x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: pnpm

      - name: 安装原生架构 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            sidecar/pyproject.toml
            .github/workflows/release.yml

      - name: 缓存 Electron 与 electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 准备 sidecar 虚拟环境
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import venv
          directory = pathlib.Path("sidecar/.venv")
          venv.EnvBuilder(with_pip=True).create(directory)
          python = directory / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
          subprocess.check_call([str(python.resolve()), "-m", "pip", "install", "-e", "sidecar/[dev]", "pyinstaller==6.22.3"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"SIDECAR_PYTHON={python.resolve()}\n")

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 记录运行环境
        run: |
          node -e "console.log('node', process.version, process.platform, process.arch)"
          python -c "import platform, struct, sys; print('python', sys.version.split()[0], sys.platform, platform.machine(), struct.calcsize('P') * 8)"
        shell: bash

      - name: 构建应用
        run: pnpm build

      - name: 构建并实跑原生 sidecar
        run: pnpm build:sidecar --arch ${{ matrix.arch }}

      - name: 打包发行物
        run: pnpm exec electron-builder --config electron-builder.config.ts ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 统一产物命名和各 channel 元数据引用
        run: pnpm exec tsx scripts/normalize-artifacts.ts dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.blockmap
            dist/*.yml
            !dist/builder-*.yml

  harmonyos-web:
    name: Validate HarmonyOS web resources
    needs: check
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || inputs.platforms == 'harmonyos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 只验证 ArkWeb 资源；HAP 由配有 HarmonyOS SDK 的 DevEco 环境构建。
      - name: 构建并同步 HarmonyOS Web 资源
        run: pnpm prepare:harmonyos

      - name: 校验同步结果
        run: |
          test -f harmonyos/entry/src/main/resources/rawfile/web/index.html
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('harmonyos/AppScope/app.json5','utf8'));const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;if(a.app.versionName!==v)throw new Error('版本未同步：'+a.app.versionName+' != '+v);if(!Number.isInteger(a.app.versionCode)||a.app.versionCode<1)throw new Error('versionCode 非法');console.log('harmonyos version',a.app.versionName,a.app.versionCode)"

  android:
    name: Build android
    needs: check
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web 渲染层
        run: pnpm build:android-web

      - name: 同步 Web 产物到安卓工程
        run: pnpm sync:android

      - name: 构建 APK（按 CPU 架构拆分）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          retention-days: 7
          path: android/app/build/outputs/apk/release/OpenRoadScope-*.apk

  publish:
    name: 发布 Release
    needs: [build, android, harmonyos-web]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) && needs.build.result != 'failure' && needs.android.result != 'failure' && needs.harmonyos-web.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码（获取 CHANGELOG 与 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验发布 tag
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::缺少发布 tag，请在 workflow_dispatch 中填写 tag 或改用 tag 触发"
            exit 1
          fi
          git fetch --tags --force origin
          if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "::error::远端不存在 tag ${RELEASE_TAG}"
            exit 1
          fi
          echo "发布 tag：${RELEASE_TAG}"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载各平台产物并保留架构子目录
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: false

      - name: 校验并合并多架构更新元数据
        run: pnpm exec tsx scripts/merge-update-metadata.ts release-downloads release-assets

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd release-assets
          files=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort)
          if [ -z "$files" ]; then
            echo "::error::发布目录为空"
            exit 1
          fi
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 从 CHANGELOG 提取当前版本说明
        run: |
          python - <<'PY'
          import os, re
          ver = os.environ["RELEASE_TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # 匹配 "## [0.1.2](...)" 或 "## 0.1.2 ..." 到下一个 "## " 或文件结尾
          m = re.search(rf"^##\s+\[?{re.escape(ver)}\]?.*?(?=^##\s|\Z)", text, re.M | re.S)
          body = m.group(0).strip() if m else ""
          open("release_body.md", "w", encoding="utf-8").write(body or "（暂无更新说明）")
          print(f"版本 {ver} 说明 {'已提取' if m else '未找到，使用占位'}")
          PY

      - name: 追加已知限制到发布说明
        run: |
          set -euo pipefail
          if [ ! -f docs/release-known-issues.md ]; then
            echo "::error::缺少 docs/release-known-issues.md"
            exit 1
          fi
          printf '\n\n' >> release_body.md
          cat docs/release-known-issues.md >> release_body.md
          echo "发布说明行数：$(wc -l < release_body.md)"

      - name: 使用 GitHub CLI 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--title "${RELEASE_TAG}")
          if printf '%s' "${RELEASE_TAG}" | grep -q '-'; then
            # 预发布标签（如 v0.2.0-rc.1）不推给稳定版用户
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，追加/覆盖产物"
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" --notes-file release_body.md "${args[@]}"
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --notes-file release_body.md "${args[@]}"
          fi

      - name: 回读 Release 产物清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json tagName,isPrerelease,assets \
            --jq '{tag:.tagName, prerelease:.isPrerelease, assets:[.assets[].name]}' | tee release-summary.json
          count=$(python -c "import json;print(len(json.load(open('release-summary.json'))['assets']))")
          if [ "$count" -lt 2 ]; then
            echo "::error::Release 产物数量异常：${count}"
            exit 1
          fi
          {
            echo "### 发布完成：${RELEASE_TAG}"
            echo ""
            echo "产物数量：${count}"
            echo ""
            echo '```'
            python -c "import json;[print(a) for a in json.load(open('release-summary.json'))['assets']]"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
