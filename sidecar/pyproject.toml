[project]
name = "obd-sidecar"
version = "0.1.0"
description = "OBD-II data acquisition sidecar for OpenRoadScope"
requires-python = ">=3.10"
dependencies = [
    "obd>=0.7.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["obd_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
