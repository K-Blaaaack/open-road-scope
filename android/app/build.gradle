apply plugin: 'com.android.application'

// 版本号与 Web/桌面端保持一致：统一从根目录 package.json 读取
def pkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def appVersion = pkg.version as String
// 预发布版本（如 0.2.0-rc.1）先剥掉 -rc.1 后缀再算 versionCode，否则解析报错
def versionParts = appVersion.split('-')[0].tokenize('.')
def appVersionCode = versionParts.size() >= 3
        ? versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()
        : 1

android {
    namespace = "dev.openroadscope.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.openroadscope.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // CI 无签名密钥：release 暂用 debug 签名，保证产物可直接安装
            signingConfig signingConfigs.debug
        }
    }
    // 应用不含 native 库，ABI 拆分只会产出三个字节相同的 APK，因此打包单一通用包；
    // 若以后引入 .so，再按 abi 拆分并恢复架构后缀命名。
    // APK 产物统一命名：OpenRoadScope-<版本>-android.apk
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "OpenRoadScope-${appVersion}-android.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.core:core:1.17.0"
    // USB 串口（ELM327 OTG 适配器）
    implementation "com.github.felHR85:UsbSerial:6.1.0"
}

repositories {
    // felHR85/UsbSerial 托管于 jitpack
    maven { url 'https://jitpack.io' }
}